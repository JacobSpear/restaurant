[project]
name = "restaurant"
version = "0.1.0"
description = "Restaurant sales data pipeline merging Toast POS and Tock reservation data"
readme = "README.md"
authors = [
    { name = "JacobSpear", email = "spearjm77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.20.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pandas-gbq>=0.23.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.0",
    "pandas-gbq>=0.19.0",
]

[project.scripts]
restaurant = "restaurant.main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""